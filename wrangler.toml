# Cloudflare Pages の設定。 npm run build && npx wrangler pages deploy でデプロイ
name = "fanvoice"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[vars]
# Macのバックエンドを Cloudflare Tunnel で公開したホスト名に書き換える
API_ORIGIN = "https://api-origin.example.com"
# 独自ドメインを使う場合に設定（canonical / sitemap のURLになる）
# SITE_URL = "https://fanvoice.example.com"

# PROXY_SECRET はシークレットとして登録する（このファイルには書かない）:
#   npx wrangler pages secret put PROXY_SECRET
